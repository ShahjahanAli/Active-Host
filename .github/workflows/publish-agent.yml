name: Publish rsm-agent to npm

on:
  push:
    tags:
      - "agent-v*"          # e.g.  git tag agent-v0.2.0 && git push --tags

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: server-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bump version from tag
        # Sets package.json version to match the git tag (strips "agent-v" prefix)
        run: |
          TAG="${GITHUB_REF_NAME#agent-v}"
          npm version "$TAG" --no-git-tag-version

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
